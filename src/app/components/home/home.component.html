<section id="home" class="hero-container">

  <div class="hero-content">
    <div class="avatar-container">
      <div class="avatar-inner">
        <span>BR</span>
      </div>
    </div>

    <h1 class="heading">Hello, I'm <span class="highlight">Bhaskara Rao</span></h1>
    <p class="sub-heading">Frontend Developer & Angular Specialist</p>
    <p class="description">
      Building enterprise-grade Angular applications with clean architecture,
      reactive patterns, and a relentless focus on performance.
    </p>

    <div class="social-links">
      <a [href]="SocialMediaLinks.github" target="_blank" class="social-icon" aria-label="GitHub">
        <i class="bi bi-github"></i>
      </a>
      <a [href]="SocialMediaLinks.linkedIn" target="_blank" class="social-icon" aria-label="LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>
      <a [href]="SocialMediaLinks.email" class="social-icon" aria-label="Email">
        <i class="bi bi-envelope-at"></i>
      </a>
    </div>

    <div class="cta-group">
      <button class="btn-primary">Explore My Work</button>
      <button class="btn-outline" (click)="downloadCV()">Download CV</button>
    </div>
  </div>
</section>
